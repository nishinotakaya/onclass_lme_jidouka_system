onclass_students_front:
  class: "Onclass::StudentsDataWorker"
  cron: "0 7-23/2 * * *"   # 7:00, 9:00, 11:00, ..., 23:00
  queue: onclass_students_data
  args:
    - "oYTO4UDI6MGb"
    - "フロントコース受講生"
  tz: "Asia/Tokyo"
  description: "フロントコース受講生データ取得"

onclass_students_backend:
  class: "Onclass::StudentsDataWorker"
  cron: "15 7-23/2 * * *"  # 7:15, 9:15, 11:15, ..., 23:15
  queue: onclass_students_data
  args:
    - "oEDI6MGb"
    - "フリーエンジニア養成コース"
  tz: "Asia/Tokyo"
  description: "バックエンドコース受講生データ取得(2時間毎)"

lme_line_inflows_daily:
  class: "Lme::LineInflowsWorker"
  cron: "0 7-23/2 * * *"
  queue: lme_line_inflows
  args:
    - "2023-01-01"
  tz: "Asia/Tokyo"
  description: "LME LINE流入数集計"

lme_line_counts_every:
  class: "Lme::LineCountsWorker"
  cron: "5 7-23/2 * * *"   # 流入集計の5分後に実行
  queue: lme_line_counts
  args:
    - null  # spreadsheet_id
    - null  # source_sheet_name
    - null  # dashboard_sheet_name
    - 2025  # target_year
  tz: "Asia/Tokyo"
  description: "LME LINEダッシュボード更新(2025年)"

lme_line_counts_2026:
  class: "Lme::LineCountsWorker"
  cron: "5 7-23/2 * * *"   # 流入集計の5分後に実行
  queue: lme_line_counts
  args:
    - null  # spreadsheet_id
    - null  # source_sheet_name
    - null  # dashboard_sheet_name
    - 2026  # target_year
  tz: "Asia/Tokyo"
  description: "LME LINEダッシュボード更新(2026年)"

# ★ 自チャンネルの YouTube Analytics（本番）
youtube_analytics_daily:
  class: "Youtube::AnalyticsWorker"
  cron: "30 7 * * *"   # 毎日 07:30
  queue: youtube_analytics
  tz: "Asia/Tokyo"
  description: "YouTube動画一覧の集計＆スプレッドシート更新"

# ★ 競合チャンネルの YouTube 分析（本番）
youtube_competitors_daily:
  class: "Youtube::CompetitorWorker"
  cron: "45 7 * * *"   # 毎日 07:45（Analytics のあと）
  queue: youtube_competitors
  tz: "Asia/Tokyo"
  description: "YouTube競合チャンネルの動画＆コメント収集"

# ★ 恋愛系・自己啓発系チャンネルのリサーチ（本番）
#   競合(07:45)と同日に走ると YouTube Data API の日次クォータ(10,000)を圧迫するため、
#   曜日をずらして週1回だけ回す
youtube_love_self_help_weekly:
  class: "Youtube::LoveSelfHelpWorker"
  cron: "0 9 * * 1"   # 毎週月曜 09:00
  queue: youtube_competitors
  tz: "Asia/Tokyo"
  description: "恋愛系・自己啓発系チャンネルの動画＆コメント収集"

# ★ アプリ体験会フォームの日程更新（本番）
#   毎週木曜20:00に発火→「今日が第2木曜か」を判定し、第2木曜だけ翌月の第2木曜へ更新
lme_seminar_date_update:
  class: "Lme::SeminarDateUpdateWorker"
  cron: "0 20 * * 4"   # 毎週木曜 20:00
  queue: lme_seminar
  tz: "Asia/Tokyo"
  description: "体験会フォームの日程セレクトを次の第2木曜へ更新"

# ★ 新規YouTube動画のLMEランディング自動作成＆概要欄URL差し替え（本番）
youtube_lme_landing_daily:
  class: "Youtube::LmeLandingWorker"
  cron: "0 8 * * *"   # 毎日 08:00（Analytics 07:30 のあと）
  queue: youtube_lme_landing
  tz: "Asia/Tokyo"
  description: "新規YouTube動画のLME QRコードアクション作成＆概要欄URL更新"

# ★ 副業案件リサーチ（HTML/CSS・Excel）— 朝だけ実行。失敗・中断したときだけ通知メールを送る
freelance_jobs_research_morning:
  class: "FreelanceJobs::ResearchWorker"
  cron: "0 6 * * *"   # 毎朝 06:00 のみ
  queue: freelance_jobs_research
  tz: "Asia/Tokyo"
  description: "副業案件（HTML/CSS・Excel、Ruby・TypeScript・React）を各サイトから取得し2シートを更新（毎朝6時・失敗時のみメール通知）"

# ★ 副業案件リサーチの見張り番 — 本体(06:00)が走らなかった/失敗したままなら通知メールを送る
freelance_jobs_watchdog_morning:
  class: "FreelanceJobs::WatchdogWorker"
  cron: "0 7 * * *"   # 毎朝 07:00（本体の1時間後）
  queue: freelance_jobs_research
  tz: "Asia/Tokyo"
  description: "副業案件バッチが実行されたかを確認し、止まっていれば通知メールを送る"
